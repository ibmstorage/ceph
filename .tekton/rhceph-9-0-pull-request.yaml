---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/ibmstorage/ceph?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "release-9.0"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ceph-9-0
    appstudio.openshift.io/component: rhceph-9-0
    pipelines.appstudio.openshift.io/type: build
  name: rhceph-9-0-on-pull-request
  namespace: ceph-tenant
spec:
  params:
    - name: ociStorage
      #value: quay.io/redhat-user-workloads/rpm-build-pipeline-tenant/rhceph-test-package:on-pr-{{ pull_request_number }}-{{revision}}
      value: quay.io/rhceph-ci/rhceph-rpms:on-pr-{{revision}}-rpms
      #value: quay.io/redhat-user-workloads/rhceph-rpms/rhceph:on-pr-{{revision}}
    - name: package-name
      value: ceph
    - name: koji-target
      value: ceph-9.0-rhel-10-candidate
    - name: git-url
      value: "{{ source_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: target-branch
      value: "{{ target_branch }}"
    - name: build-architectures
      value:
        - x86_64
  pipelineRef:
    resolver: git
    params:
      - name: url
        #value: "https://github.com/konflux-ci/rpmbuild-pipeline.git"
        #value: "https://gitlab.cee.redhat.com/rhel-on-konflux/rpmbuild-pipeline.git"
        value: "https://gitlab.cee.redhat.com/ceph/rpmbuild-pipeline.git"
      - name: revision
        value: ceph-9.0
      - name: pathInRepo
        value: pipeline/build-rhel-package.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhceph-9-0
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
